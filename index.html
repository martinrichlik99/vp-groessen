<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Vienna Pirates · Größen</title><link rel="icon" type="image/png" href="vp-logo-icon.png"><link rel="apple-touch-icon" href="vp-logo-icon.png"></head><body>
<style>
  :root{--red:#c42a2a;--bg:#111;--bg2:#181818;--line:#2a2a2a;--text:#f2f2f2;--muted:#8d8d8d;--amber:#d4a23a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%;}
  header{position:sticky;top:0;z-index:1;background:var(--bg);padding:14px 16px 12px;border-bottom:1px solid var(--line);}
  .top{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.2px;} .brand span{color:var(--red);}
  .stand{font-size:12px;color:var(--muted);}
  .logout{margin-left:auto;background:none;border:none;color:var(--muted);font:inherit;font-size:13px;padding:6px 0;cursor:pointer;}
  input{font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px;}
  main{max-width:640px;margin:0 auto;padding-bottom:40px;}
  .login{max-width:340px;margin:20vh auto 0;display:flex;flex-direction:column;gap:12px;padding:0 16px;}
  .login button{font:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--red);border:none;border-radius:10px;padding:12px;cursor:pointer;}
  .err{color:#e58a8a;font-size:14px;min-height:1.2em;}
  details{border-bottom:1px solid var(--line);scroll-margin-top:120px;}
  summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;font-weight:700;font-size:17px;}
  summary::-webkit-details-marker{display:none;}
  summary small{color:var(--muted);font-weight:400;font-size:14px;margin-left:auto;}
  summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 0;transition:transform .2s;}
  details[open] summary::after{transform:rotate(-135deg);margin-top:4px;}
  details[open] summary{color:var(--red);}
  .p{padding:12px 16px;border-top:1px solid var(--line);}
  .p b{display:block;font-size:16px;margin-bottom:6px;}
  .p b small{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px;}
  .coach b{color:var(--amber);}
  dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;margin:0;}
  dt{font-size:11px;color:var(--muted);} dd{margin:0;font-weight:600;font-size:15px;}
  h3{margin:0;padding:14px 16px 6px;font-size:12px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.6px;border-top:1px solid var(--line);}
  .none{color:var(--muted);padding:16px;}
</style>

pHandyPw";
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function decrypt(pw){
  const b=Uint8Array.from(atob(ENC),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},key,b.slice(28))));
}
function login(msg){
  app.innerHTML=`<form class="login"><div class="brand">Vienna <span>Pirates</span> · Größen</div>
    <label for="pw">Passwort</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="err" role="alert">${esc(msg||'')}</div><button>Öffnen</button></form>`;
  app.querySelector('form').onsubmit=async e=>{
    e.preventDefault();const pw=app.querySelector('#pw').value;
    try{show(await decrypt(pw));try{localStorage.setItem(PWKEY,pw);}catch(_){}}
    catch(_){login('Passwort falsch.');}
  };
  app.querySelector('#pw').focus();
}
function show(d){
  document.body.insertAdjacentHTML('afterbegin',`<header><div class="top"><div class="brand">Vienna <span>Pirates</span></div><span class="stand">Stand ${esc(STAND)}</span><button class="logout" id="out">Abmelden</button></div>
    <input type="search" id="q" placeholder="Name suchen…" aria-label="Name suchen"></header>`);
  const q=document.getElementById('q');
  const card=(p,team)=>`<div class="p${p.c?' coach':''}"><b>${esc(p.n)}${team?`<small>${esc(team)}</small>`:''}</b>${p.s.length?`<dl>${p.s.map(([l,v])=>`<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:'<span class="stand">keine Größen</span>'}</div>`;
  const list=ps=>{const a=ps.filter(p=>!p.c),c=ps.filter(p=>p.c);return a.map(p=>card(p)).join('')+(c.length?`<h3>Coaches &amp; Betreuer</h3>${c.map(p=>card(p)).join('')}`:'');};
  const teams=d.teams.map(t=>`<details name="team"><summary>${esc(t.name)}<small>${t.p.filter(p=>!p.c).length}</small></summary>${list(t.p)}</details>`).join('');
  function render(){
    const term=q.value.trim().toLowerCase();
    if(!term){app.innerHTML=teams;return;}
    const hits=d.teams.flatMap(t=>t.p.filter(p=>p.n.toLowerCase().includes(term)).map(p=>card(p,t.name)));
    app.innerHTML=hits.join('')||'<div class="none">Niemand gefunden.</div>';
  }
  app.addEventListener('toggle',e=>{if(e.target.open)e.target.scrollIntoView({block:'start'});},true);
  q.oninput=render;
  document.getElementById('out').onclick=()=>{try{localStorage.removeItem(PWKEY);}catch(_){}location.reload();};
  render();
}
let saved=null;try{saved=localStorage.getItem(PWKEY);}catch(_){}
if(saved){try{show(await decrypt(saved));return;}catch(_){}}
login();
})();
