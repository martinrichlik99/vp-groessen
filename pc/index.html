<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vienna Pirates · Größen</title>
<link rel="icon" type="image/png" href="vp-logo-icon.png">
<style>
  :root{
    --red:#961b1b; --red-glow:rgba(150,27,27,.55);
    --bg:#131313; --bg2:#1a1a1a; --card:#1f1f1f; --border:#333;
    --text:#f2f2f2; --muted:#9a9a9a; --amber:#c9962c; --coach:#241f14;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',sans-serif;}
  h1,h2,.brand,button{font-family:'Montserrat','Segoe UI',sans-serif;}

  .topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap;}
  .brand{font-weight:800;font-size:18px;letter-spacing:.3px;cursor:pointer;}
  .brand span{color:var(--red);}
  #status{font-size:12px;color:var(--muted);margin-right:auto;}

  button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-size:13px;cursor:pointer;transition:box-shadow .3s,border-color .3s;}
  button:hover{border-color:var(--red);box-shadow:0 0 10px var(--red-glow);}
  button.primary{background:var(--red);border-color:var(--red);}
  button.danger{border-color:#7a2020;color:#e08585;padding:4px 9px;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:1px;}

  main{max-width:1600px;margin:0 auto;padding:24px 22px 60px;}
  h2{margin:0 0 4px;font-size:22px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}

  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
  body.start::before{content:'';position:fixed;inset:0;z-index:-1;background:url(vp-hintergrund.jpg) 68% 25%/cover;opacity:.12;-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent);}
  body.start .team-card{background:rgba(31,31,31,.72);}
  body.start .team-card:hover{background:rgba(48,24,24,.8);}
  .stats{display:flex;gap:44px;margin:26px 0 30px;flex-wrap:wrap;}
  .stats div{display:flex;flex-direction:column;}
  .stats b{font-family:'Montserrat','Segoe UI',sans-serif;font-size:52px;font-weight:800;line-height:1;}
  .stats span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin-top:6px;}
  .stats .rot b{color:var(--red);}
  .team-card{text-align:left;padding:18px;border-left:4px solid var(--red);display:flex;flex-direction:column;gap:6px;}
  .team-card b{font-size:17px;}
  .team-card small{color:var(--muted);font-size:12px;font-family:'Inter','Segoe UI',sans-serif;}

  .head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .head{position:sticky;top:var(--topbar-h,62px);z-index:9;background:var(--bg);padding:8px 0;}
  .head .actions{margin-left:auto;display:flex;gap:8px;}
  .head .actions input{width:280px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font:inherit;font-size:13px;}
  @keyframes neu{from{background:var(--red-glow);}}
  tr.neu td{animation:neu 2.5s;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
  table{border-collapse:collapse;width:100%;min-width:1100px;}
  th{background:var(--bg2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:10px 6px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:4px 6px;border-bottom:1px solid #262626;}
  tr:hover td{background:#1c1c1c;}
  td input,td select{width:100%;background:transparent;color:var(--text);border:1px solid transparent;border-radius:6px;padding:6px 7px;font:inherit;font-size:13px;}
  td input:hover,td select:hover{border-color:var(--border);}
  td input:focus,td select:focus{border-color:var(--red);background:var(--card);}
  td select{background:var(--bg);}
  td select.sz{appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;}
  td select.sz option{background:var(--card);}
  .c-name{width:150px;} .c-name input{font-weight:600;}
  .c-geb{width:110px;} .c-size{width:88px;} .c-div{width:170px;} .c-team{width:140px;} .c-del{width:44px;text-align:center;}
  tr.sep td{background:var(--coach);color:var(--amber);font-family:'Montserrat','Segoe UI',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-top:2px solid var(--amber);}
  tr.coach td{background:var(--coach);}
  tr.coach td.c-name input{color:var(--amber);}
  .empty{color:var(--muted);padding:18px;}
  .hidden{display:none;}
  dialog{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:min(420px,92vw);}
  dialog::backdrop{background:rgba(0,0,0,.6);}
  dialog label{display:block;font-size:13px;color:var(--muted);margin-top:12px;}
  dialog input{display:block;width:100%;margin-top:4px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font:inherit;}
  .dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .best-card{border-left-color:var(--amber);}
  .bereich{margin-top:44px;padding-top:22px;border-top:1px solid var(--border);}
  .bereich h3{margin:0 0 14px;font:700 12px 'Montserrat','Segoe UI',sans-serif;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
  .head .actions select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font:inherit;font-size:13px;}
  .oname{background:transparent;color:var(--text);border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-7px;font:800 22px 'Montserrat','Segoe UI',sans-serif;width:min(420px,60vw);}
  .oname:hover{border-color:var(--border);} .oname:focus{border-color:var(--red);background:var(--card);}
  .badge{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
  .badge.bestellt{color:var(--amber);border-color:var(--amber);} .badge.geliefert{color:#86c986;border-color:#3d6b3d;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;}
  .chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);}
  .summe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px;font-size:13px;}
  .summe span{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;}
  .summe .ges{background:var(--red);border-color:var(--red);font-weight:700;}
  .warn{color:#e08585;}
  .table-wrap.o{max-width:980px;} table.otab{min-width:0;}
  tr.grp td{background:var(--bg2);font-family:'Montserrat','Segoe UI',sans-serif;font-weight:700;padding:10px 12px;border-top:2px solid var(--red);}
  tr.grp small{color:var(--muted);font:400 12px 'Inter','Segoe UI',sans-serif;margin:0 10px;}
  tr.grp button{padding:3px 10px;font-size:12px;margin-left:6px;}
  tr.weg td{opacity:.4;}
  .c-chk{width:56px;text-align:center;}
  td input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--red);cursor:pointer;}
  td.txt{padding:8px 7px;font-size:13px;}
  .link{background:none;border:none;padding:0;color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px;}
  .link:hover{box-shadow:none;color:#fff;}
  button:disabled{opacity:.4;cursor:default;box-shadow:none;}
  #druck{display:none;}
  @media print{
    body>:not(#druck){display:none!important;}
    body{background:#fff;} body.start::before{display:none;}
    @page{size:A4;margin:16mm 16mm 20mm;@top-left{content:""}@top-center{content:""}@top-right{content:""}@bottom-left{content:""}@bottom-center{content:""}@bottom-right{content:""}}
    #druck{display:block;color:#111;font:13px 'Inter','Segoe UI',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    #druck .dk{display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:3px solid var(--red);}
    #druck .dk img{width:64px;height:64px;}
    #druck .dk small{display:block;font:600 11px 'Montserrat','Segoe UI',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#666;}
    #druck h1{font:800 30px 'Montserrat','Segoe UI',sans-serif;margin:2px 0 0;}
    #druck .dinfo{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin:18px 0;}
    #druck dt{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#777;}
    #druck dd{margin:3px 0 0;font-weight:700;font-size:15px;}
    #druck .dnotiz{border-left:3px solid var(--red);background:#f4f4f4;padding:10px 14px;margin:0 0 6px;}
    #druck .dnotiz p{margin:4px 0 0;white-space:pre-wrap;}
    #druck h2{font:700 12px 'Montserrat','Segoe UI',sans-serif;text-transform:uppercase;letter-spacing:.6px;color:#333;margin:22px 0 8px;}
    #druck table{min-width:0;border-collapse:collapse;break-inside:auto;}
    #druck .sum{width:55%;} #druck .pt{width:100%;table-layout:fixed;}
    #druck .pt th,#druck .pt td{padding:5px 4px;font-size:11px;}
    #druck .pt th{text-transform:none;letter-spacing:0;font-size:10px;}
    #druck .pt th:first-child{width:44px;} #druck .pt th:last-child{width:50px;}
    #druck tr{break-inside:avoid;}
    #druck th{background:#fff;color:#666;font-size:10px;letter-spacing:.4px;text-align:left;padding:6px 8px;border-bottom:2px solid #111;white-space:normal;}
    #druck td{background:#fff;color:#111;padding:6px 8px;border-bottom:1px solid #e3e3e3;font-size:13px;}
    #druck tbody tr:nth-child(even) td{background:#f4f4f4;}
    #druck td:first-child{font-weight:700;}
    #druck td:not(:first-child),#druck th:not(:first-child){text-align:right;}
    #druck .sum td:last-child,#druck .pt td:last-child{font-weight:800;}
    #druck tfoot td{background:var(--red);color:#fff;font-weight:800;border:none;}
    #druck footer{margin-top:28px;font-size:10px;color:#888;border-top:1px solid #ddd;padding-top:6px;}
    #druck .seite{break-after:page;}
    #druck .seite:last-child{break-after:auto;}
    #druck .seite .dk img{width:52px;height:52px;}
    #druck .seite h1{font-size:26px;}
    #druck .dsub{margin-left:auto;text-align:right;font-size:11px;color:#666;line-height:1.5;}
    #druck .tl{table-layout:fixed;margin-top:14px;}
    #druck .tl th,#druck .tl td{padding:3px 4px;font-size:10.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #druck .tl th{white-space:normal;font-size:10px;vertical-align:bottom;}
    #druck .tl th:nth-child(-n+2),#druck .tl td:nth-child(-n+2){text-align:left;}
    #druck .tl td:nth-child(-n+2){font-weight:600;}
    #druck .tl td:nth-child(n+3){font-weight:700;}
    #druck .tl .leer{color:#bbb;font-weight:400;}
    #druck .tl .trenn td{background:#fff;text-align:left;padding-top:12px;font:700 10px 'Montserrat','Segoe UI',sans-serif;text-transform:uppercase;letter-spacing:.6px;color:#333;border-bottom:2px solid var(--red);}
    #druck .ml{column-count:2;column-gap:12mm;margin-top:16px;}
    #druck .mb{break-inside:avoid;margin:0 0 16px;}
    #druck .mb h3{display:flex;justify-content:space-between;font:800 14px 'Montserrat','Segoe UI',sans-serif;margin:0 0 4px;padding-bottom:4px;border-bottom:3px solid var(--red);}
    #druck .mb h3 span:last-child{font-size:12px;color:#666;font-weight:600;}
    #druck .mb table{width:100%;}
    #druck .mb th,#druck .mb td{padding:3px 8px;font-size:12px;}
    #druck .mb td:last-child{font-weight:800;}
    #druck .hin{margin:4px 0 0;font-size:10px;color:#666;font-style:italic;}
  }
  .notiz{display:block;max-width:980px;margin:0 0 18px;font-size:12px;color:var(--muted);}
  .notiz textarea{display:block;width:100%;margin-top:4px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font:inherit;font-size:13px;resize:vertical;}
  .notiz textarea:focus-visible{outline:2px solid var(--red);outline-offset:1px;}
</style>
</head>

<template id="handyTpl">
<style>
  :root{--red:#c42a2a;--bg:#111;--bg2:#181818;--line:#2a2a2a;--text:#f2f2f2;--muted:#8d8d8d;--amber:#d4a23a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%;}
  header{position:sticky;top:0;z-index:1;background:var(--bg);padding:14px 16px 12px;border-bottom:1px solid var(--line);}
  .top{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.2px;} .brand span{color:var(--red);}
  .stand{font-size:12px;color:var(--muted);}
  .logout{margin-left:auto;background:none;border:none;color:var(--muted);font:inherit;font-size:13px;padding:6px 0;cursor:pointer;}
  input{font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;}

  .login{max-width:340px;margin:20vh auto 0;display:flex;flex-direction:column;gap:12px;padding:0 16px;}
  .login button{font:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--red);border:none;border-radius:10px;padding:12px;cursor:pointer;}

  summary::-webkit-details-marker{display:none;}
  summary small{color:var(--muted);font-weight:400;font-size:14px;margin-left:auto;}
  summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 0;transition:transform .2s;}
  details[open] summary::after{transform:rotate(-135deg);margin-top:4px;}
  details[open] summary{color:var(--red);}

  dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;margin:0;}

  .none{color:var(--muted);padding:16px;}
</style>
<main id="app"></main>
<script>
(async function(){
const ENC="__DATA__",STAND="__STAND__",PWKEY="vpHandyPw";
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function decrypt(pw){
  const b=Uint8Array.from(atob(ENC),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},key,b.slice(28))));
}
function login(msg){
  app.innerHTML=`<form class="login"><div class="brand">Vienna <span>Pirates</span> · Größen</div>
    <label for="pw">Passwort</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="err" role="alert">${esc(msg||'')}</div><button>Öffnen</button></form>`;
  app.querySelector('form').onsubmit=async e=>{
    e.preventDefault();const pw=app.querySelector('#pw').value;
    try{show(await decrypt(pw));try{localStorage.setItem(PWKEY,pw);}catch(_){}}
    catch(_){login('Passwort falsch.');}
  };
  app.querySelector('#pw').focus();
}
function show(d){
  document.body.insertAdjacentHTML('afterbegin',`<header><div class="top"><div class="brand">Vienna <span>Pirates</span></div><span class="stand">Stand ${esc(STAND)}</span><button class="logout" id="out">Abmelden</button></div>
    <input type="search" id="q" placeholder="Name suchen…" aria-label="Name suchen"></header>`);
  const q=document.getElementById('q');
  const card=(p,team)=>`<div class="p${p.c?' coach':''}"><b>${esc(p.n)}${team?`<small>${esc(team)}</small>`:''}</b>${p.s.length?`<dl>${p.s.map(([l,v])=>`<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:'<span class="stand">keine Größen</span>'}</div>`;
  const list=ps=>{const a=ps.filter(p=>!p.c),c=ps.filter(p=>p.c);return a.map(p=>card(p)).join('')+(c.length?`<h3>Coaches &amp; Betreuer</h3>${c.map(p=>card(p)).join('')}`:'');};
  const teams=d.teams.map(t=>`<details name="team"><summary>${esc(t.name)}<small>${t.p.filter(p=>!p.c).length}</small></summary>${list(t.p)}</details>`).join('');
  function render(){
    const term=q.value.trim().toLowerCase();
    if(!term){app.innerHTML=teams;return;}
    const hits=d.teams.flatMap(t=>t.p.filter(p=>p.n.toLowerCase().includes(term)).map(p=>card(p,t.name)));
    app.innerHTML=hits.join('')||'<div class="none">Niemand gefunden.</div>';
  }
  app.addEventListener('toggle',e=>{if(e.target.open)e.target.scrollIntoView({block:'start'});},true);
  q.oninput=render;
  document.getElementById('out').onclick=()=>{try{localStorage.removeItem(PWKEY);}catch(_){}location.reload();};
  render();
}
let saved=null;try{saved=localStorage.getItem(PWKEY);}catch(_){}
if(saved){try{show(await decrypt(saved));return;}catch(_){}}
login();
})();
</script>
</template>

<script>

const FIELDS=[['tshirt','T-Shirt'],['dressOben','Dress oben'],['dressUnten','Dress unten'],['bh','Sport BH'],['schuhe','Schuhe'],['shorts','Shorts']];
const SIZES=['Y2XS','YXS','YS','YM','YL','YXL','2XS','XS','S','M','L','XL','XXL','L/XL','70','90','104','110','116','122','128','130','134','136','140','146','150','152','156','158','160','164','176','/'];
const SHOES=['5','5,5','6','6,5','7','7,5','8','8,5','9','9,5','10','10,5','11','11,5','12','/'];
const app=document.getElementById('app');
const statusEl=document.getElementById('status');
const teamsErgaenzen=s=>{for(const t of DEFAULT.teams)if(!s.teams.some(x=>x.id===t.id||x.name===t.name))s.teams.push({...t});return s;};
let state=load();

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&Array.isArray(s.teams)&&Array.isArray(s.people)&&s.people.length) return teamsErgaenzen(s);
  }catch(e){}
  return structuredClone(DEFAULT);
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    statusEl.textContent='Gespeichert '+new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    statusEl.textContent='⚠ Speichern fehlgeschlagen – bitte „Sicherung speichern“';
  }
  sichern();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const nachname=n=>n.trim().split(/\s+/).pop()||'\uffff';
const teile=n=>{const w=n.trim().split(/\s+/).filter(Boolean);return w.length<2?{nach:'',vor:w.join(' ')}:{nach:w.pop(),vor:w.join(' ')};};
const members=tid=>state.people.filter(p=>p.teamId===tid).sort((a,b)=>(!!a.coach-!!b.coach)||nachname(a.name).localeCompare(nachname(b.name),'de')||a.name.localeCompare(b.name,'de'));

const neueId=k=>k+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const orders=()=>state.orders||=[];
const ART=Object.fromEntries(FIELDS);
const STATUS={entwurf:'Entwurf',bestellt:'Bestellt',geliefert:'Geliefert'};
const datumAT=d=>new Date(d).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});
const hatGroesse=g=>!!g&&g!=='/';

function render(){
  const h=location.hash.slice(1);
  const team=state.teams.find(t=>t.id===h);
  document.body.classList.toggle('start',!team&&!h.startsWith('b')&&h!=='l');
  if(h==='l')renderLists();
  else if(h==='b')renderOrders();
  else if(h.startsWith('b='))renderOrder(orders().find(o=>o.id===h.slice(2)));
  else team?renderTeam(team):renderOverview();
}

function renderOverview(){
  const ath=state.people.filter(p=>!p.coach).length;
  app.innerHTML=`<div class="stats"><div class="rot"><b>${ath}</b><span>Athlet:innen</span></div><div><b>${state.people.length-ath}</b><span>Coaches &amp; Betreuer</span></div><div><b>${state.teams.length}</b><span>Teams</span></div></div>${state.people.length?'':'<div class="sub">Noch keine Daten: „Ordner verbinden“ (vorhandene Sicherung wird geladen) oder „Sicherung laden“.</div>'}
  <div class="grid">${state.teams.map(t=>{
    const m=members(t.id),c=m.filter(p=>p.coach).length;
    return `<button class="team-card" data-team="${esc(t.id)}"><b>${esc(t.name)}</b><small>${m.length-c} Athlet:innen${c?` · ${c} Coaches/Betreuer`:''}</small></button>`;
  }).join('')}</div>
  <section class="bereich"><h3>Bestellungen &amp; Listen</h3><div class="grid"><button class="team-card best-card" data-orders><b>Bestellungen</b><small>${orders().filter(o=>o.status!=='geliefert').length} offen · ${orders().length} gesamt</small></button><button class="team-card best-card" data-lists><b>Trainer-Listen</b><small>PDF je Team: Namen &amp; Größen · Mengen</small></button></div></section>`;
}

function entwurfZeilen(o){
  return state.teams.filter(t=>o.teams.includes(t.id)).flatMap(t=>members(t.id).map(p=>{
    const w=o.wahl[p.id]||{};
    return {pid:p.id,name:p.name,teamId:t.id,team:t.name,coach:p.coach,gr:w.gr??p[o.artikel]??'',an:w.an??true};
  }));
}
const zeilen=o=>o.liste||entwurfZeilen(o);
const aktiv=o=>o.liste||entwurfZeilen(o).filter(z=>z.an&&hatGroesse(z.gr));
function summe(o,rows){
  const L=o.artikel==='schuhe'?SHOES:SIZES,n={};
  rows.forEach(z=>n[z.gr]=(n[z.gr]||0)+1);
  const pos=g=>L.includes(g)?L.indexOf(g):999;
  return Object.entries(n).sort((a,b)=>pos(a[0])-pos(b[0])||a[0].localeCompare(b[0],'de'));
}
const summeText=(o,rows)=>summe(o,rows).map(([g,n])=>`${esc(g)} × ${n}`).join(' · ');

function renderOrders(){
  const os=orders();
  app.innerHTML=`<div class="head">
      <button data-back>← Alle Teams</button>
      <div><h2>Bestellungen</h2><div class="sub" style="margin:0">${os.length} Bestellung${os.length===1?'':'en'}</div></div>
      <div class="actions"><input id="oName" placeholder="Name, z. B. T-Shirts Herbst" aria-label="Name der neuen Bestellung" autocomplete="off">
        <select id="oArt" aria-label="Artikel">${FIELDS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
        <button class="primary" data-neu>+ Neue Bestellung</button></div>
    </div>
    ${os.length?`<div class="table-wrap o"><table class="otab">
      <thead><tr><th>Bestellung</th><th>Artikel</th><th>Status</th><th>Angelegt</th><th>Stück</th><th>Bezahlt</th><th>Ausgegeben</th></tr></thead>
      <tbody>${[...os].reverse().map(o=>{
        const a=aktiv(o),f=k=>o.liste?`${a.filter(z=>z[k]).length} / ${a.length}`:'–';
        return `<tr><td class="txt"><button class="link" data-order="${esc(o.id)}">${esc(o.name)}</button></td><td class="txt">${esc(ART[o.artikel])}</td>
          <td class="txt"><span class="badge ${o.status}">${STATUS[o.status]}</span></td><td class="txt">${datumAT(o.angelegt)}</td>
          <td class="txt">${a.length}</td><td class="txt">${f('bez')}</td><td class="txt">${f('aus')}</td></tr>`;
      }).join('')}</tbody></table></div>`:'<div class="empty">Noch keine Bestellung. Oben Name eingeben, Artikel wählen, „+ Neue Bestellung“.</div>'}`;
}

function renderOrder(o){
  if(!o){renderOrders();return;}
  const fix=!!o.liste,L=zeilen(o),a=aktiv(o);
  const ohne=fix?0:L.filter(z=>z.an&&!hatGroesse(z.gr)).length;
  const teams=fix?[...new Map(L.map(z=>[z.teamId,z.team]))]:state.teams.filter(t=>o.teams.includes(t.id)).map(t=>[t.id,t.name]);
  const zaehl=k=>a.filter(z=>z[k]).length;
  const knopf={entwurf:'Als bestellt markieren',bestellt:'Als geliefert markieren'}[o.status];
  const sizeSel=z=>{
    const opts=['',...(o.artikel==='schuhe'?SHOES:SIZES)];
    if(z.gr&&!opts.includes(z.gr))opts.push(z.gr);
    return `<select class="sz" data-o="gr" aria-label="Größe ${esc(z.name)}">${opts.map(g=>`<option value="${esc(g)}"${g===z.gr?' selected':''}>${g?esc(g):'–'}</option>`).join('')}<option value="__andere">Andere…</option></select>`;
  };
  const zeile=z=>{const n=teile(z.name);return fix
    ?`<tr data-pid="${esc(z.pid)}"${z.coach?' class="coach"':''}><td class="txt">${esc(n.nach)}</td><td class="txt">${esc(n.vor)}</td><td class="txt"><b>${esc(z.gr)}</b></td>
      <td class="c-chk"><input type="checkbox" data-o="bez"${z.bez?' checked':''} aria-label="${esc(z.name)} bezahlt"></td>
      <td class="c-chk"><input type="checkbox" data-o="aus"${z.aus?' checked':''} aria-label="${esc(z.name)} ausgegeben"></td></tr>`
    :`<tr data-pid="${esc(z.pid)}" class="${z.coach?'coach':''}${z.an?'':' weg'}"><td class="c-chk"><input type="checkbox" data-o="an"${z.an?' checked':''} aria-label="${esc(z.name)} bestellen"></td>
      <td class="txt">${esc(n.nach)}</td><td class="txt">${esc(n.vor)}</td><td class="c-size">${sizeSel(z)}</td>
      <td class="txt">${z.an&&!hatGroesse(z.gr)?'<span class="warn">keine Größe</span>':''}</td></tr>`;};
  const gruppe=([tid,name])=>{
    const tz=L.filter(z=>z.teamId===tid),ta=fix?tz:tz.filter(z=>z.an&&hatGroesse(z.gr));
    return `<tr class="grp"><td colspan="5">${esc(name)}<small>${ta.length} Stück${ta.length?': '+summeText(o,ta):''}</small>${fix?'':`<button data-alle="${esc(tid)}">alle</button><button data-keine="${esc(tid)}">keine</button>`}</td></tr>${tz.map(zeile).join('')}`;
  };
  app.innerHTML=`<div class="head">
      <button data-orders>← Alle Bestellungen</button>
      <div><input class="oname" data-oname value="${esc(o.name)}" aria-label="Name der Bestellung">
        <div class="sub" style="margin:2px 0 0">${esc(ART[o.artikel])} · <span class="badge ${o.status}">${STATUS[o.status]}</span> · angelegt ${datumAT(o.angelegt)}${o.bestellt?` · bestellt ${datumAT(o.bestellt)}`:''}${o.geliefert?` · geliefert ${datumAT(o.geliefert)}`:''}</div></div>
      <div class="actions"><button data-druck${a.length?'':' disabled'}>PDF / Drucken</button>${knopf?`<button class="primary" data-status${a.length?'':' disabled'}>${knopf}</button>`:''}<button class="danger" data-odel>Löschen</button></div>
    </div>
    ${fix?'':`<div class="sub">Teams auswählen:</div><div class="chips">${state.teams.map(t=>`<button class="chip" data-tteam="${esc(t.id)}" aria-pressed="${o.teams.includes(t.id)}">${esc(t.name)}</button>`).join('')}</div>`}
    <div class="summe"><span class="ges">${a.length} Stück</span>${summe(o,a).map(([g,n])=>`<span>${esc(g)} × ${n}</span>`).join('')}
      ${ohne?`<b class="warn">${ohne} ohne Größe – werden nicht bestellt</b>`:''}
      ${fix?`<span>bezahlt ${zaehl('bez')} / ${a.length}</span><span>ausgegeben ${zaehl('aus')} / ${a.length}</span>`:''}</div>
    <label class="notiz">Bemerkung (erscheint im PDF)<textarea data-onotiz rows="2" placeholder="z. B. Farbe schwarz, Logo hinten">${esc(o.notiz)}</textarea></label>
    ${teams.length?`<div class="table-wrap o"><table class="otab">
      <thead><tr>${fix?'<th>Nachname</th><th>Vorname</th><th>Größe</th><th class="c-chk">Bezahlt</th><th class="c-chk">Ausgegeben</th>':'<th class="c-chk">Bestellen</th><th>Nachname</th><th>Vorname</th><th>Größe</th><th></th>'}</tr></thead>
      <tbody>${teams.map(gruppe).join('')}</tbody></table></div>`:'<div class="empty">Noch kein Team ausgewählt.</div>'}`;
}

function drucken(o){
  const a=aktiv(o),s=summe(o,a),heute=datumAT(Date.now());
  const teams=[...new Map(a.map(z=>[z.teamId,z.team]))];
  const anz=(tid,g)=>a.filter(z=>z.teamId===tid&&(g===undefined||z.gr===g)).length;
  document.getElementById('druck').innerHTML=`<div class="dk"><img src="vp-logo-icon.png" alt=""><div><small>Vienna Pirates Cheerleading</small><h1>Bestellung</h1></div></div>
    <dl class="dinfo"><div><dt>Bestellung</dt><dd>${esc(o.name)}</dd></div><div><dt>Artikel</dt><dd>${esc(ART[o.artikel])}</dd></div>
      <div><dt>Datum</dt><dd>${heute}</dd></div><div><dt>Stück gesamt</dt><dd>${a.length}</dd></div></dl>
    ${o.notiz?`<div class="dnotiz"><b>Bemerkung</b><p>${esc(o.notiz)}</p></div>`:''}
    <h2>Mengen nach Größe</h2>
    <table class="sum"><thead><tr><th>Größe</th><th>Stück</th></tr></thead>
      <tbody>${s.map(([g,n])=>`<tr><td>${esc(g)}</td><td>${n}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Gesamt</td><td>${a.length}</td></tr></tfoot></table>
    ${teams.length>1?`<h2>Aufteilung nach Team</h2>
    <table class="pt"><thead><tr><th>Größe</th>${teams.map(([,n])=>`<th>${esc(n)}</th>`).join('')}<th>Gesamt</th></tr></thead>
      <tbody>${s.map(([g,n])=>`<tr><td>${esc(g)}</td>${teams.map(([id])=>`<td>${anz(id,g)||''}</td>`).join('')}<td>${n}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Gesamt</td>${teams.map(([id])=>`<td>${anz(id)}</td>`).join('')}<td>${a.length}</td></tr></tfoot></table>`:''}
    <footer>Vienna Pirates Cheerleading · erstellt am ${heute}</footer>`;
  print();
}

app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.matches('[data-orders]')){location.hash='b';return;}
  if(t.matches('[data-order]')){location.hash='b='+t.dataset.order;return;}
  if(t.matches('[data-neu]')){neueBestellung();return;}
  const o=orders().find(x=>x.id===location.hash.slice(3));if(!o)return;
  if(t.matches('[data-tteam]')){const id=t.dataset.tteam;o.teams=o.teams.includes(id)?o.teams.filter(x=>x!==id):[...o.teams,id];}
  else if(t.matches('[data-alle],[data-keine]')){const an=t.matches('[data-alle]'),tid=t.dataset.alle||t.dataset.keine;members(tid).forEach(p=>o.wahl[p.id]={...o.wahl[p.id],an});}
  else if(t.matches('[data-druck]')){drucken(o);return;}
  else if(t.matches('[data-status]')){
    if(o.status==='entwurf'){
      const ohne=entwurfZeilen(o).filter(z=>z.an&&!hatGroesse(z.gr)).length;
      if(!confirm(`„${o.name}“ als bestellt markieren?\n\n${aktiv(o).length} Stück. Die Liste wird danach eingefroren – spätere Größenänderungen ändern diese Bestellung nicht mehr.${ohne?`\n\nAchtung: ${ohne} ausgewählte Personen ohne Größe werden nicht bestellt.`:''}`))return;
      o.liste=aktiv(o).map(({pid,name,teamId,team,coach,gr})=>({pid,name,teamId,team,coach,gr,bez:false,aus:false}));
      delete o.wahl;o.status='bestellt';o.bestellt=tag();
    }else{o.status='geliefert';o.geliefert=tag();}
  }
  else if(t.matches('[data-odel]')){
    if(!confirm(`Bestellung „${o.name}“ wirklich löschen?`))return;
    state.orders=orders().filter(x=>x!==o);save();location.hash='b';return;
  }
  else return;
  save();render();
});

let lSel=new Set(state.teams.map(t=>t.id)),lArt='beide';
const istHinweis=g=>hatGroesse(g)&&!/^[0-9XYSML/()\s,.-]+$/i.test(g);

function renderLists(){
  const ts=state.teams.filter(t=>lSel.has(t.id)),seiten=ts.length*(lArt==='beide'?2:1);
  app.innerHTML=`<div class="head">
      <button data-back>← Alle Teams</button>
      <div><h2>Trainer-Listen</h2><div class="sub" style="margin:0">Mit Namen – nur für die Trainer. Pro Team und Liste eine A4-Seite.</div></div>
      <div class="actions"><button class="primary" data-ldruck${seiten?'':' disabled'}>PDF / Drucken (${seiten} Seite${seiten===1?'':'n'})</button></div>
    </div>
    <div class="sub">Welche Liste?</div>
    <div class="chips">${[['namen','Namensliste'],['mengen','Mengenliste'],['beide','Beide']].map(([k,l])=>`<button class="chip" data-lart="${k}" aria-pressed="${lArt===k}">${l}</button>`).join('')}</div>
    <div class="sub">Teams auswählen: <button data-lalle>alle</button> <button data-lkeine>keine</button></div>
    <div class="chips">${state.teams.map(t=>`<button class="chip" data-lteam="${esc(t.id)}" aria-pressed="${lSel.has(t.id)}">${esc(t.name)}</button>`).join('')}</div>
    <div class="sub"><b>Namensliste:</b> Name und Größe je Artikel, Coaches &amp; Betreuer abgesetzt. Artikel, die im Team niemand hat, fehlen. <b>Mengenliste:</b> je Artikel Größe × Stück.</div>`;
}

const listenKopf=(t,art)=>{
  const m=members(t.id),co=m.filter(p=>p.coach).length;
  return `<div class="dk"><img src="vp-logo-icon.png" alt=""><div><small>Vienna Pirates Cheerleading · ${art}</small><h1>${esc(t.name)}</h1></div>
    <div class="dsub">${m.length-co} Athlet:innen${co?` · ${co} Coaches/Betreuer`:''}<br>Stand ${datumAT(Date.now())}</div></div>`;
};

function namensliste(t){
  const m=members(t.id),sp=FIELDS.filter(([k])=>m.some(p=>hatGroesse(p[k]))),co=m.filter(p=>p.coach);
  const zeile=p=>{const n=teile(p.name);return `<tr><td>${esc(n.nach)}</td><td>${esc(n.vor)}</td>${sp.map(([k])=>`<td>${hatGroesse(p[k])?esc(p[k]):'<span class="leer">–</span>'}</td>`).join('')}</tr>`;};
  return `<section class="seite">${listenKopf(t,'Größenliste')}
    <table class="tl" style="width:${64+19*sp.length}mm"><colgroup><col style="width:32mm"><col style="width:32mm">${sp.map(()=>'<col style="width:19mm">').join('')}</colgroup>
      <thead><tr><th>Nachname</th><th>Vorname</th>${sp.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead>
      <tbody>${m.filter(p=>!p.coach).map(zeile).join('')}${co.length?`<tr class="trenn"><td colspan="${sp.length+2}">Coaches &amp; Betreuer</td></tr>${co.map(zeile).join('')}`:''}</tbody></table></section>`;
}

function mengenliste(t){
  const m=members(t.id),hatCo=m.some(p=>p.coach);
  const bloecke=FIELDS.map(([k,l])=>{
    const L=k==='schuhe'?SHOES:SIZES,n={},hin={};
    m.filter(p=>hatGroesse(p[k])).forEach(p=>{const z=istHinweis(p[k])?hin:n;(z[p[k]]||={a:0,c:0})[p.coach?'c':'a']++;});
    const pos=g=>L.includes(g)?L.indexOf(g):999,zeilen=Object.entries(n).sort((a,b)=>pos(a[0])-pos(b[0])||a[0].localeCompare(b[0],'de'));
    if(!zeilen.length)return '';
    const ges=zeilen.reduce((s,[,v])=>s+v.a+v.c,0);
    return `<div class="mb"><h3><span>${l}</span><span>${ges} Stück</span></h3>
      <table><thead><tr><th>Größe</th>${hatCo?'<th>Athlet:innen</th><th>Coaches</th><th>Gesamt</th>':'<th>Stück</th>'}</tr></thead>
      <tbody>${zeilen.map(([g,v])=>`<tr><td>${esc(g)}</td>${hatCo?`<td>${v.a||''}</td><td>${v.c||''}</td><td>${v.a+v.c}</td>`:`<td>${v.a}</td>`}</tr>`).join('')}</tbody></table>
      ${Object.keys(hin).length?`<p class="hin">Hinweis, nicht mitgezählt: ${Object.entries(hin).map(([g,v])=>`${esc(g)} (${v.a+v.c}×)`).join(', ')}</p>`:''}</div>`;
  }).join('');
  return `<section class="seite">${listenKopf(t,'Mengenliste')}<div class="ml">${bloecke||'<p>Keine Größen eingetragen.</p>'}</div></section>`;
}

function druckenListen(){
  document.getElementById('druck').innerHTML=state.teams.filter(t=>lSel.has(t.id))
    .map(t=>(lArt!=='mengen'?namensliste(t):'')+(lArt!=='namen'?mengenliste(t):'')).join('');
  print();
}

app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.matches('[data-lists]')){location.hash='l';return;}
  if(location.hash!=='#l')return;
  if(t.matches('[data-lart]'))lArt=t.dataset.lart;
  else if(t.matches('[data-lteam]')){const id=t.dataset.lteam;lSel.has(id)?lSel.delete(id):lSel.add(id);}
  else if(t.matches('[data-lalle]'))lSel=new Set(state.teams.map(x=>x.id));
  else if(t.matches('[data-lkeine]'))lSel=new Set();
  else if(t.matches('[data-ldruck]')){druckenListen();return;}
  else return;
  render();
});

function neueBestellung(){
  const inp=document.getElementById('oName'),name=inp.value.trim();
  if(!name){inp.focus();return;}
  const o={id:neueId('b'),name,artikel:document.getElementById('oArt').value,status:'entwurf',angelegt:tag(),teams:[],wahl:{}};
  orders().push(o);save();location.hash='b='+o.id;
}

app.addEventListener('change',e=>{
  const t=e.target,o=orders().find(x=>x.id===location.hash.slice(3));
  if(!o||!(t.dataset.o||'oname' in t.dataset||'onotiz' in t.dataset))return;
  if('oname' in t.dataset){o.name=t.value.trim()||o.name;save();return;}
  if('onotiz' in t.dataset){o.notiz=t.value.trim();save();return;}
  const pid=t.closest('tr').dataset.pid,k=t.dataset.o;
  if(o.liste)o.liste.find(z=>z.pid===pid)[k]=t.checked;
  else{
    const w=o.wahl[pid]||={};
    if(k==='an')w.an=t.checked;
    else{
      const v=t.value==='__andere'?prompt('Größe eingeben:'):t.value;
      if(v!==null)w.gr=v.trim();
    }
  }
  save();render();
});

function sizeSelect(k,l,v){
  const opts=['',...(k==='schuhe'?SHOES:SIZES)];
  if(v&&!opts.includes(v)) opts.push(v);
  return `<select class="sz" data-f="${k}" aria-label="${l}">${opts.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${o?esc(o):'–'}</option>`).join('')}<option value="__andere">Andere…</option></select>`;
}

function row(p){
  const cells=FIELDS.map(([k,l])=>`<td class="c-size">${sizeSelect(k,l,p[k])}</td>`).join('');
  const opts=state.teams.map(t=>`<option value="${esc(t.id)}"${t.id===p.teamId?' selected':''}>${esc(t.name)}</option>`).join('');
  return `<tr data-id="${esc(p.id)}"${p.coach?' class="coach"':''}>
    <td class="c-name"><input data-f="nach" value="${esc(teile(p.name).nach)}" aria-label="Nachname"></td>
    <td class="c-name"><input data-f="vor" value="${esc(teile(p.name).vor)}" aria-label="Vorname"></td>
    <td class="c-geb"><input data-f="geb" value="${esc(p.geb)}" aria-label="Geburtsdatum"></td>
    ${cells}
    <td class="c-div"><input data-f="div" value="${esc(p.div)}" aria-label="Diverses"></td>
    <td class="c-team"><select data-f="teamId" aria-label="Team">${opts}</select></td>
    <td class="c-del"><button class="danger" data-del title="Löschen" aria-label="${esc(p.name)} löschen">✕</button></td>
  </tr>`;
}

function renderTeam(team){
  const m=members(team.id),ath=m.filter(p=>!p.coach),co=m.filter(p=>p.coach);
  app.innerHTML=`<div class="head">
      <button data-back>← Alle Teams</button>
      <div><h2>${esc(team.name)}</h2><div class="sub" style="margin:0">${ath.length} Athlet:innen${co.length?` · ${co.length} Coaches/Betreuer`:''}</div></div>
      <div class="actions"><input id="addName" placeholder="Name eintragen (Vorname Nachname) …" aria-label="Neuer Name" autocomplete="off"><button class="primary" data-add="0">+ Athlet:in</button><button data-add="1">+ Coach/Betreuer</button></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nachname</th><th>Vorname</th><th>Geb.Datum</th>${FIELDS.map(f=>`<th>${f[1]}</th>`).join('')}<th>Diverses</th><th>Team</th><th></th></tr></thead>
      <tbody>${ath.map(row).join('')||'<tr><td colspan="13" class="empty">Noch niemand im Team.</td></tr>'}
      ${co.length?`<tr class="sep"><td colspan="13">Coaches &amp; Betreuer</td></tr>${co.map(row).join('')}`:''}</tbody>
    </table></div>`;
}

function addPerson(coach){
  const name=document.getElementById('addName').value.trim();
  if(!name){document.getElementById('addName').focus();return;}
  const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),teamId:location.hash.slice(1),name,coach,geb:'',div:''};
  FIELDS.forEach(([k])=>p[k]='');
  state.people.push(p);save();render();
  app.querySelector(`tr[data-id="${p.id}"]`).classList.add('neu');
  document.getElementById('addName').focus({preventScroll:true});
  statusEl.textContent=`${name} eingetragen`;
}
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='addName')addPerson(false);
  if(e.target.id==='oName')neueBestellung();
});

app.addEventListener('click',e=>{
  const card=e.target.closest('[data-team]');
  if(card){location.hash=card.dataset.team;return;}
  if(e.target.closest('[data-back]')){location.hash='';return;}
  const add=e.target.closest('[data-add]');
  if(add){addPerson(add.dataset.add==='1');return;}
  if(e.target.closest('[data-del]')){
    const p=state.people.find(x=>x.id===e.target.closest('tr').dataset.id);
    if(confirm(`„${p.name||'Ohne Namen'}“ wirklich löschen?`)){state.people=state.people.filter(x=>x!==p);save();render();}
  }
});

app.addEventListener('change',e=>{
  const f=e.target.dataset.f;if(!f)return;
  const p=state.people.find(x=>x.id===e.target.closest('tr').dataset.id);
  if(e.target.value==='__andere'){
    const inp=document.createElement('input');
    inp.dataset.f=f;inp.value=p[f];inp.setAttribute('aria-label',e.target.getAttribute('aria-label'));
    e.target.replaceWith(inp);inp.focus();inp.select();
    return;
  }
  if(f==='nach'||f==='vor'){
    const tr=e.target.closest('tr'),g=k=>tr.querySelector(`[data-f="${k}"]`).value.trim();
    p.name=`${g('vor')} ${g('nach')}`.trim();
  }else p[f]=e.target.value.trim();
  save();
  if((f==='nach'||f==='vor')&&members(p.teamId).map(x=>x.id).join()!==[...app.querySelectorAll('tr[data-id]')].map(r=>r.dataset.id).join()) render();
  if(e.target.tagName==='INPUT'&&FIELDS.some(([k])=>k===f)) render();
  if(f==='teamId'){
    const t=state.teams.find(x=>x.id===p.teamId);
    statusEl.textContent=`${p.name} → ${t.name} verschoben`;
    render();
  }
});

document.getElementById('home').addEventListener('click',()=>location.hash='');
window.addEventListener('hashchange',render);
const topbar=document.querySelector('.topbar');
new ResizeObserver(()=>document.documentElement.style.setProperty('--topbar-h',topbar.offsetHeight+'px')).observe(topbar);

function herunterladen(name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}
document.getElementById('btnExport').addEventListener('click',async()=>{
  const name=`pirates-groessen-${tag()}-${new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}).replace(':','')}.json`;
  try{
    if(gemerkt&&!dir&&await gemerkt.requestPermission({mode:'readwrite'})==='granted'){dir=gemerkt;await abgleich();}
    if(dir&&bereit&&state.people.length){
      const txt=JSON.stringify(state,null,1);
      const w=await(await dir.getFileHandle(name,{create:true})).createWritable();await w.write(txt);await w.close();
      if(await(await(await dir.getFileHandle(name)).getFile()).text()!==txt)throw new Error('Rücklesen stimmt nicht');
      statusEl.textContent='Sicherung im Ordner: '+name;return;
    }
    statusEl.textContent='Kein Ordner verfügbar – Datei wird heruntergeladen';
  }catch(e){statusEl.textContent='⚠ Ordner-Sicherung nicht möglich ('+e.message+') – Datei wird heruntergeladen';}
  herunterladen(name);
});
const fileIn=document.getElementById('fileImport');
document.getElementById('btnImport').addEventListener('click',()=>fileIn.click());
fileIn.addEventListener('change',async()=>{
  const f=fileIn.files[0];fileIn.value='';if(!f)return;
  try{
    const s=JSON.parse(await f.text());
    if(!Array.isArray(s.teams)||!Array.isArray(s.people)||!s.people.length) throw 0;
    if(!confirm(`Sicherung mit ${s.people.length} Personen laden? Der aktuelle Stand wird ersetzt.`))return;
    state=teamsErgaenzen(s);save();location.hash='';render();
  }catch(e){alert('Diese Datei ist keine gültige Größen-Sicherung.');}
});

const kurzName=n=>{const [v,...r]=String(n).trim().split(/\s+/);return [v,...r.map(w=>w[0].toUpperCase()+'.')].join(' ');};
async function encrypt(obj,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  const all=new Uint8Array([...salt,...iv,...ct]);
  let bin='';for(const b of all)bin+=String.fromCharCode(b);
  return btoa(bin);
}
const dlg=document.getElementById('dlgHandy'),pw1=document.getElementById('pw1'),pw2=document.getElementById('pw2'),pwMsg=document.getElementById('pwMsg');
document.getElementById('btnHandy').addEventListener('click',()=>{pw1.value=pw2.value=pwMsg.textContent='';dlg.showModal();});
dlg.querySelector('form').addEventListener('submit',async e=>{
  if(e.submitter?.value!=='ok')return;
  if(pw1.value!==pw2.value){e.preventDefault();pwMsg.textContent='Die Passwörter stimmen nicht überein.';return;}
  const data={teams:state.teams.map(t=>({name:t.name,p:members(t.id).filter(p=>p.name.trim()).map(p=>({
    n:kurzName(p.name),c:p.coach,s:FIELDS.filter(([k])=>p[k]).map(([k,l])=>[l,p[k]])
  }))}))};
  const stand=new Date().toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});
  const tpl=document.getElementById('handyTpl').innerHTML.replace('__DATA__',await encrypt(data,pw1.value)).replace('__STAND__',stand);
  const html=`<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Vienna Pirates · Größen</title><link rel="icon" type="image/png" href="vp-logo-icon.png"><link rel="apple-touch-icon" href="vp-logo-icon.png"></head><body>${tpl}</body></html>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download='handy.html';a.click();URL.revokeObjectURL(a.href);
  statusEl.textContent='Handy-Datei erzeugt – jetzt auf Netlify hochladen';
});

const btnOrdner=document.getElementById('btnOrdner');
const DATEI='pirates-groessen.json',OSTAND='vpGroessenOrdnerStand';
const tag=()=>new Date().toLocaleDateString('sv-SE');
const idb=(mode,fn)=>new Promise((ok,err)=>{const o=indexedDB.open('vpGroessenOrdner',1);o.onupgradeneeded=()=>o.result.createObjectStore('h');o.onerror=()=>err(o.error);o.onsuccess=()=>{const t=o.result.transaction('h',mode),r=fn(t.objectStore('h'));t.oncomplete=()=>ok(r.result);t.onerror=()=>err(t.error);};});
let dir=null,gemerkt=null,bereit=false,timer=0;
const ordnerText=(t,titel='')=>{btnOrdner.textContent=t;btnOrdner.title=titel;};
const merkeStand=()=>{try{localStorage.setItem(OSTAND,JSON.stringify(state));}catch(e){}};
async function lese(){
  try{
    const s=JSON.parse(await(await(await dir.getFileHandle(DATEI)).getFile()).text());
    return Array.isArray(s.teams)&&Array.isArray(s.people)?teamsErgaenzen(s):'defekt';
  }catch(e){return e.name==='NotFoundError'?null:'defekt';}
}
async function kopie(name,immer){
  if(!immer){try{await dir.getFileHandle(name);return;}catch(e){}}
  const w=await(await dir.getFileHandle(name,{create:true})).createWritable();
  await w.write(await(await(await dir.getFileHandle(DATEI)).getFile()).text());await w.close();
  const alt=[];for await(const n of dir.keys())if(/^sicherung-\d{4}-\d\d-\d\d\.json$/.test(n))alt.push(n);
  for(const n of alt.sort().slice(0,-14))await dir.removeEntry(n);
}
async function abgleich(){
  bereit=false;
  const s=await lese();
  if(s==='defekt'){ordnerText('⚠ Ordner unlesbar','Die Sicherung im Ordner ist nicht lesbar – es wird nichts überschrieben.');return;}
  if(s&&s.people.length&&JSON.stringify(s)!==JSON.stringify(state)&&JSON.stringify(s)!==localStorage.getItem(OSTAND)){
    if(!state.people.length||confirm(`Im Ordner liegt eine Sicherung mit ${s.people.length} Personen. Diese laden und den aktuellen Stand (${state.people.length} Personen) ersetzen?\n\nAbbrechen = aktueller Stand bleibt, die Sicherung im Ordner wird als Kopie aufgehoben.`)){
      state=s;save();render();
    }else await kopie(`sicherung-${tag()}-vor-abgleich.json`,true);
  }
  bereit=true;
  if(state.people.length)await schreibe();else ordnerText('💾 '+dir.name+' ✓');
}
async function schreibe(){
  if(!dir||!bereit||!state.people.length)return;
  try{
    const alt=await lese();
    if(alt==='defekt')throw new Error('Datei im Ordner nicht lesbar – nichts überschrieben');
    if(!alt||JSON.stringify(alt)!==JSON.stringify(state)){
      if(alt)await kopie(`sicherung-${tag()}.json`);
      const w=await(await dir.getFileHandle(DATEI,{create:true})).createWritable();
      await w.write(JSON.stringify(state,null,1));await w.close();
      const neu=await lese();
      if(!neu||neu==='defekt'||neu.people.length!==state.people.length)throw new Error('Rücklesen stimmt nicht');
    }
    merkeStand();
    ordnerText('💾 '+dir.name+' · '+new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ordnerText('⚠ Ordner-Sicherung fehlgeschlagen',e.message);}
}
function sichern(){clearTimeout(timer);timer=setTimeout(schreibe,600);}
btnOrdner.addEventListener('click',async()=>{
  try{
    if(gemerkt&&!dir){if(await gemerkt.requestPermission({mode:'readwrite'})!=='granted')return;dir=gemerkt;}
    else{dir=await showDirectoryPicker({mode:'readwrite'});await idb('readwrite',s=>s.put(dir,'dir'));}
    await abgleich();
  }catch(e){if(e.name!=='AbortError')ordnerText('⚠ Ordner-Fehler',e.message);}
});
if(!window.showDirectoryPicker)btnOrdner.classList.add('hidden');
else idb('readonly',s=>s.get('dir')).then(async h=>{
  if(!h)return;
  gemerkt=h;
  if(await h.queryPermission({mode:'readwrite'})==='granted'){dir=h;await abgleich();}
  else ordnerText('Zugriff bestätigen','Ordner ist gemerkt – einmal klicken, dann läuft die Sicherung weiter.');
}).catch(()=>{});

render();
})();
</script>
